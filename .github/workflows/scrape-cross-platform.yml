name: Weekday cross-platform shops

# Public-storefront ingest for Feedle and Korean breeder shops (Korea),
# Repsuki (Japan), terraristik.com (Europe), TikisGeckos and Altitude Exotics (US) into
# cross_platform_listings, plus daily exchange rates and price snapshots. Does not touch MorphMarket tables
# and must not share the scrape-listings concurrency group.
#
# 10:50am America/Denver during MDT is 16:50 UTC. Chosen to sit after
# scrape-listings-catalog-api (35 14 * * 1-5 UTC) so the two jobs do not
# start together. Revisit after the fall DST change (MST is UTC-7).
on:
  schedule:
    - cron: '50 16 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: "all, feedle_kr, kr_shops, repsuki, terraristik, tikis or altitude"
        required: false
        default: all

concurrency:
  group: scrape-cross-platform
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scrape_cross_platform.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          TRIGGERED_BY: github_action_cross_platform
          SOURCE: ${{ inputs.source || 'all' }}
        working-directory: scripts
        run: python scrape_cross_platform.py --source="$SOURCE"

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Weekday cross-platform ingest (Feedle, Korean shops, terraristik, US shops) did not complete."

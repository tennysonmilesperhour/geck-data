name: Weekly Sellers Scrape

# Refreshes stores linked from active listings using Chromium and the same
# residential proxy route as the catalog. Catalog API reads supply seller slugs.
# Requests are sequential because a Playwright browser belongs to one thread.
on:
  # Still paused until a capped manual run validates the replacement browser
  # route and current page parser. Do not restore a schedule based on CI alone.
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum records for recovery check (0 runs the full backlog)'
        required: true
        default: '5'
        type: string

# Sellers scrape is independent of the listings concurrency group,
# but we still want only one of these in flight at a time so a
# manual dispatch during a scheduled run can't double-write.
concurrency:
  group: scrape-sellers
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Full-backlog duration needs validation before restoring the schedule.
    timeout-minutes: 180
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scrape_sellers.py
        env:
          MORPHMARKET_PROXY_URL: ${{ secrets.MORPHMARKET_PROXY_URL }}
          MAX_SELLERS: ${{ inputs.max_records }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          TRIGGERED_BY: github_action
        working-directory: scripts
        run: python scrape_sellers.py

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Weekly sellers scrape did not complete."

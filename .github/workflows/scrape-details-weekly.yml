name: Weekly Details Scrape

on:
  # Still paused until a capped manual run validates the replacement browser
  # route and current page parser. Do not restore a schedule based on CI alone.
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum records for recovery check (0 runs the full backlog)'
        required: true
        default: '5'
        type: string

concurrency:
  group: scrape-details
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scrape_details.py
        env:
          MORPHMARKET_PROXY_URL: ${{ secrets.MORPHMARKET_PROXY_URL }}
          MAX_LISTINGS: ${{ inputs.max_records }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          TRIGGERED_BY: github_action
        working-directory: scripts
        run: python scrape_details.py

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Weekly detail scrape did not complete; traits/prices go stale until it succeeds."

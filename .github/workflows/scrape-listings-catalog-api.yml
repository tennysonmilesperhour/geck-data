name: Weekday API listings (catalog recrawl)

# Recrawl every animal MorphMarket currently has listed (not a first_listed
# window). Crested rows are kept client-side. After a complete walk this
# job calls mark_unseen_listings_inactive so live flags drop for ads the
# catalog no longer shows.
#
# Freshness and inactive flags depend on this weekday recrawl. The Monday
# weekly 7-day job (scrape-listings-weekly-api.yml) is new-ad enrichment
# only and must not call mark_unseen.
#
# 8:35am America/Denver during MDT is 14:35 UTC. Revisit after the fall
# DST change (MST is UTC-7).
on:
  schedule:
    - cron: '35 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # MorphMarket blocks GitHub-hosted runners (HTTP 403 on every run
      # since 2026-08-31). Without a residential proxy this job cannot
      # succeed, so it skips with a notice instead of writing a failed
      # scrape_runs row every day. The daily scrape runs from Tennyson's
      # Mac instead (scripts/local/setup_mac.sh, docs/SCRAPER_SETUP.md).
      # Adding the MORPHMARKET_PROXY_URL secret turns this job back on.
      - name: Check MorphMarket access route
        id: route
        env:
          PROXY: ${{ secrets.MORPHMARKET_PROXY_URL }}
        run: |
          if [ -z "$PROXY" ]; then
            echo "::notice title=Skipped::MorphMarket blocks GitHub-hosted runners. The scrape runs on the Mac schedule (docs/SCRAPER_SETUP.md). Add the MORPHMARKET_PROXY_URL secret to run it here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.route.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.route.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.route.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium
        if: steps.route.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run scrape_listings_api.py (catalog recrawl)
        if: steps.route.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          MORPHMARKET_PROXY_URL: ${{ secrets.MORPHMARKET_PROXY_URL }}
          MORPHMARKET_PROXY_COUNTRY: ${{ secrets.MORPHMARKET_PROXY_COUNTRY || 'us' }}
          MORPHMARKET_PROXY_SESSION_ID: ${{ secrets.MORPHMARKET_PROXY_SESSION_ID }}
          MORPHMARKET_PROXY_USERNAME_TEMPLATE: ${{ secrets.MORPHMARKET_PROXY_USERNAME_TEMPLATE }}
          MORPHMARKET_PROXY_GEO_ATTEMPTS: ${{ vars.MORPHMARKET_PROXY_GEO_ATTEMPTS || '5' }}
          MORPHMARKET_PAGE_RETRIES: ${{ vars.MORPHMARKET_PAGE_RETRIES || '2' }}
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TRIGGERED_BY: github_action_catalog_api
          INGEST_MODE: catalog
          # MorphMarket lists about 82,000 animals (about 820 pages) as of Oct 2026.
          # 1200 leaves room so the walk reaches the end and can mark sold ads inactive.
          MAX_PAGES: '1200'
        working-directory: scripts
        run: python scrape_listings_api.py --mode=catalog

      - name: Refresh and verify combo_index_daily
        if: steps.route.outputs.run == 'true'
        uses: ./.github/actions/refresh-indices
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-key: ${{ secrets.SUPABASE_SERVICE_KEY }}
          supabase-db-schema: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Weekday API catalog recrawl did not complete."

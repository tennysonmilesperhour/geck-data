name: Weekly API listings (last 7 days)

# Crested geckos first-listed in the past week, via MorphMarket's JSON
# API. No Decodo. Morph tags come from cached_traits (never the title).
# Original JPEG URLs are stored so scrape-images-weekly.yml can copy
# them into the listing-images bucket.
#
# This is new-ad enrichment only. Do not call mark_unseen here: a
# first_listed window is not a catalog walk. Freshness and inactive
# flags depend on the weekday catalog recrawl
# (scrape-listings-catalog-api.yml, weekdays 8:35am America/Denver).
#
# Monday 14:55 UTC is 8:55am America/Denver during MDT.
on:
  schedule:
    - cron: '55 14 * * 1'
  workflow_dispatch:

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # MorphMarket blocks GitHub-hosted runners (HTTP 403 on every run
      # since 2026-08-31). Without a residential proxy this job cannot
      # succeed, so it skips with a notice instead of writing a failed
      # scrape_runs row every day. The daily scrape runs from Tennyson's
      # Mac instead (scripts/local/setup_mac.sh, docs/SCRAPER_SETUP.md).
      # Adding the MORPHMARKET_PROXY_URL secret turns this job back on.
      - name: Check MorphMarket access route
        id: route
        env:
          PROXY: ${{ secrets.MORPHMARKET_PROXY_URL }}
        run: |
          if [ -z "$PROXY" ]; then
            echo "::notice title=Skipped::MorphMarket blocks GitHub-hosted runners. The scrape runs on the Mac schedule (docs/SCRAPER_SETUP.md). Add the MORPHMARKET_PROXY_URL secret to run it here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repo
        if: steps.route.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.route.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.route.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium
        if: steps.route.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run scrape_listings_api.py (last 7 days)
        if: steps.route.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}
          MORPHMARKET_PROXY_URL: ${{ secrets.MORPHMARKET_PROXY_URL }}
          TRIGGERED_BY: github_action_weekly_api
          WINDOW_HOURS: '168'
        working-directory: scripts
        run: python scrape_listings_api.py

      # The ingest is the only thing that adds new observations, so refresh
      # the combo index here instead of leaving Monday's listings invisible
      # until the 08:30 UTC nightly run the next morning.
      - name: Refresh and verify combo_index_daily
        if: steps.route.outputs.run == 'true'
        uses: ./.github/actions/refresh-indices
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-key: ${{ secrets.SUPABASE_SERVICE_KEY }}
          supabase-db-schema: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Weekly API listings ingest (last 7 days) did not complete."

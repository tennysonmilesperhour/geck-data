name: legacy-migrations-read-only

# Geck Data now lives in the `geck_data` schema of the Geck Inspect Supabase
# project. These files describe the retired standalone database and must not be
# replayed against the consolidated project: many predate schema qualification
# and would target `public`. Add future database migrations to the Geck Inspect
# repository instead.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
  pull_request:
    paths:
      - "supabase/migrations/**.sql"

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Geck Data migrations are archived. Add the migration to the Geck Inspect repository."
          exit 1

name: Nightly Index Refresh

# combo_index_daily is a MATERIALIZED view (migrations 0035/0036/0037): it
# only reflects new price_history rows after an explicit refresh. This runs
# the SECURITY DEFINER helper once a night and then verifies the view
# actually caught up, because a refresh that returns 2xx proves nothing on
# its own (see .github/actions/refresh-indices and migration 0040).
#
# The weekly ingest triggers its own refresh when it finishes, so Monday's
# listings appear the same day instead of waiting for this run.
on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC nightly
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Refresh and verify combo_index_daily
        uses: ./.github/actions/refresh-indices
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-key: ${{ secrets.SUPABASE_SERVICE_KEY }}
          supabase-db-schema: ${{ vars.SUPABASE_DB_SCHEMA || 'public' }}

      - name: Notify Discord on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          context: "Nightly combo_index_daily refresh failed or the view is behind its inputs; /indices and combo sparklines will go stale."
